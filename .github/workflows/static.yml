name: Deploy Sentima to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website source
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the static public website
        run: bun run build
        env:
          GITHUB_PAGES: "true"
          VITE_GITHUB_PAGES: "true"
          VITE_SITE_URL: https://${{ github.repository_owner }}.github.io

      - name: Check the home page and add direct-link fallback
        run: |
          test -f .output/public/index.html
          cp .output/public/index.html .output/public/404.html

      - name: Upload the built website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

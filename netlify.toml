# Netlify build settings for the Sentima website.
# The build detects Netlify automatically and packages the server code
# as a Netlify Function; static files are published from `dist`.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"
  # The Lovable Vite config falls back to Cloudflare; always build the SSR server for Netlify.
  NITRO_PRESET = "netlify"
